services:
  - type: web
    name: sigap-berau
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/sigap-berau.db
      - key: UPLOAD_DIR
        value: /var/data/uploads/epss
      - key: AUTH_SECRET
        generateValue: true
    disk:
      name: sigap-berau-data
      mountPath: /var/data
      sizeGB: 5

